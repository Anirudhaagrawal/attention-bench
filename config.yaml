# FlashInfer Heterogeneity Benchmark Configuration
# =================================================

# Model Configuration
model:
  num_qo_heads: 8
  num_kv_heads: 1
  head_dim: 128
  page_size: 256
  workspace_size: 134217728  # 128 MB

# Profiling Configuration
profiling:
  num_warmup_iters: 10
  num_active_iters: 100

# Output Configuration
output:
  results_dir: "results"
  plots_dir: "plots"


# Approaches to benchmark
approaches:
  - flashinfer_mixed_fa2
  - flashinfer_mixed_fa3
  - flashinfer_mixed_cudnn
  - flashinfer_separated_fa2
  - flashinfer_separated_fa3
  - official_fa3

# Variants
variants:
  # Prefills
  prefill_q16_kv512k:
    q_tokens: 16
    kv_tokens: 524288
    description: "Small chunk prefill (16 q, 512K kv)"
  
  prefill_q32_kv512k:
    q_tokens: 32
    kv_tokens: 524288
    description: "Medium chunk prefill (32 q, 512K kv)"

  prefill_q128_kv2k:
    q_tokens: 128
    kv_tokens: 2048
    description: "Short prefill (128 q, 2K kv)"

  prefill_q256_kv4k:
    q_tokens: 256
    kv_tokens: 4096
    description: "Short prefill (256 q, 4K kv)"

  prefill_q512_kv8k:
    q_tokens: 512
    kv_tokens: 8192
    description: "Short prefill (512 q, 8K kv)"

  prefill_q256_kv256k:
    q_tokens: 256
    kv_tokens: 262144
    description: "Long prefill (256 q, 256K kv)"

  prefill_q64_kv512k:
    q_tokens: 64
    kv_tokens: 524288
    description: "Medium prefill (64 q, 512K kv)"

  prefill_q512_kv512k:
    q_tokens: 512
    kv_tokens: 524288
    description: "Long prefill (512 q, 512K kv)"

  prefill_q128_kv1m:
    q_tokens: 128
    kv_tokens: 1048576
    description: "Medium prefill (128 q, 1M kv)"

  prefill_q1k_kv1m:
    q_tokens: 1024
    kv_tokens: 1048576
    description: "Long prefill (1024 q, 1M kv)"

  prefill_q2k_kv2m:
    q_tokens: 2048
    kv_tokens: 2097152
    description: "Very long prefill (2048 q, 2M kv)"

  # Decodes
  decode_q1_kv512:
    q_tokens: 1
    kv_tokens: 512
    description: "Tiny decode (1 q, 512 kv)"

  decode_q1_kv1k:
    q_tokens: 1
    kv_tokens: 1024
    description: "Mini decode (1 q, 1K kv)"

  decode_q1_kv2k:
    q_tokens: 1
    kv_tokens: 2048
    description: "Short decode (1 q, 2K kv)"

  decode_q1_kv4k:
    q_tokens: 1
    kv_tokens: 4096
    description: "Short decode (1 q, 4K kv)"

  decode_q1_kv8k:
    q_tokens: 1
    kv_tokens: 8192
    description: "Short decode (1 q, 8K kv)"

  decode_q1_kv256k:
    q_tokens: 1
    kv_tokens: 262144
    description: "Long decode (1 q, 256K kv)"

  decode_q1_kv512k:
    q_tokens: 1
    kv_tokens: 524288
    description: "Long decode (1 q, 512K kv)"

  decode_q1_kv1m:
    q_tokens: 1
    kv_tokens: 1048576
    description: "Long decode (1 q, 1M kv)"

  decode_q1_kv2m:
    q_tokens: 1
    kv_tokens: 2097152
    description: "Ultra-long decode (1 q, 2M kv)"

# Scenarios
scenarios:
  lp1_sp1:
    name: "1 Long Prefill + 1 Short Prefill"
    description: "Basic prefill heterogeneity"
    variants_to_run:
      - prefill_q128_kv2k: 1
        prefill_q256_kv256k: 1
      - prefill_q256_kv4k: 1
        prefill_q512_kv512k: 1
      - prefill_q512_kv8k: 1
        prefill_q1k_kv1m: 1

  lp1_sp8:
    name: "1 Long Prefill + 8 Short Prefills"
    description: "One long prefill with multiple short prefills"
    variants_to_run:
      - prefill_q128_kv2k: 8
        prefill_q256_kv256k: 1
      - prefill_q256_kv4k: 8
        prefill_q512_kv512k: 1
      - prefill_q512_kv8k: 8
        prefill_q1k_kv1m: 1

  lp1_sd64:
    name: "1 Long Prefill + 64 Short Decodes"
    description: "Long prefill with many short decodes"
    variants_to_run:
      - decode_q1_kv2k: 64
        prefill_q256_kv256k: 1
      - decode_q1_kv4k: 64
        prefill_q512_kv512k: 1
      - decode_q1_kv8k: 64
        prefill_q1k_kv1m: 1

  sp1_sd64:
    name: "1 Short Prefill + 64 Short Decodes"
    description: "Short prefill with many short decodes"
    variants_to_run:
      - decode_q1_kv2k: 64
        prefill_q128_kv2k: 1
      - decode_q1_kv4k: 64
        prefill_q256_kv4k: 1
      - decode_q1_kv8k: 64
        prefill_q512_kv8k: 1

  ld1_sd64:
    name: "1 Long Decode + 64 Short Decodes"
    description: "One long decode with many short decodes"
    variants_to_run:
      - decode_q1_kv2k: 64
        decode_q1_kv256k: 1
      - decode_q1_kv4k: 64
        decode_q1_kv512k: 1
      - decode_q1_kv8k: 64
        decode_q1_kv1m: 1

  lp1_ld1_sd32:
    name: "1 LP + 1 LD + 32 SD"
    description: "Mixed long and short requests"
    variants_to_run:
      - decode_q1_kv2k: 32
        decode_q1_kv256k: 1
        prefill_q256_kv256k: 1
      - decode_q1_kv4k: 32
        decode_q1_kv512k: 1
        prefill_q512_kv512k: 1
      - decode_q1_kv8k: 32
        decode_q1_kv1m: 1
        prefill_q1k_kv1m: 1

  full_mix:
    name: "1 LP + 1 SP + 4 LD + 32 SD"
    description: "All four request types mixed"
    variants_to_run:
      - decode_q1_kv2k: 32
        decode_q1_kv256k: 4
        prefill_q128_kv2k: 1
        prefill_q256_kv256k: 1
      - decode_q1_kv4k: 32
        decode_q1_kv512k: 4
        prefill_q256_kv4k: 1
        prefill_q512_kv512k: 1
      - decode_q1_kv8k: 32
        decode_q1_kv1m: 4
        prefill_q512_kv8k: 1
        prefill_q1k_kv1m: 1

  flipping_cases:
    name: "Flipping Cases: Very Long Prefills"
    description: "Two very long prefills - KEY SCENARIO WHERE BUCKETED WINS"
    variants_to_run:
      - prefill_q1k_kv1m: 1
        prefill_q2k_kv2m: 1

  varied_q_fixed_kv:
    name: "Varied Q Lengths, Fixed KV Length"
    description: "Different query lengths with similar KV cache sizes"
    variants_to_run:
      - prefill_q64_kv512k: 1
        prefill_q128_kv1m: 1

  multiple_fixed_kv:
    name: "Multiple Fixed KV Length Requests"
    description: "Multiple requests with identical KV cache sizes"
    variants_to_run:
      - prefill_q64_kv512k: 3

  bimodal_kv_distribution:
    name: "Bimodal KV Length Distribution"
    description: "3 large KV cache requests and 60 small KV cache requests"
    variants_to_run:
      - decode_q1_kv512: 60
        decode_q1_kv2m: 3

  extreme_bimodal_kv:
    name: "Extreme Bimodal KV Distribution"
    description: "2 very large KV cache requests and 100 very small KV cache requests"
    variants_to_run:
      - decode_q1_kv512: 100
        decode_q1_kv2m: 2

  multimodal_kv_distribution:
    name: "Multimodal KV Length Distribution"
    description: "Requests with KV cache sizes spanning multiple orders of magnitude"
    variants_to_run:
      - decode_q1_kv512: 32
        decode_q1_kv1k: 32
        decode_q1_kv512k: 16
        decode_q1_kv1m: 8
        decode_q1_kv2m: 4

  small_chunk_q16_sd32:
    name: "Small Chunk Prefill (16q) + 32 Short Decodes"
    description: "Small chunk prefill with many short decodes"
    variants_to_run:
      - decode_q1_kv2k: 32
        prefill_q16_kv512k: 1
      - decode_q1_kv4k: 32
        prefill_q16_kv512k: 1
      - decode_q1_kv8k: 32
        prefill_q16_kv512k: 1

  small_chunk_q32_sd32:
    name: "Small Chunk Prefill (32q) + 32 Short Decodes"
    description: "Medium chunk prefill with many short decodes"
    variants_to_run:
      - decode_q1_kv2k: 32
        prefill_q32_kv512k: 1
      - decode_q1_kv4k: 32
        prefill_q32_kv512k: 1
      - decode_q1_kv8k: 32
        prefill_q32_kv512k: 1

  small_chunk_q16_sd64:
    name: "Small Chunk Prefill (16q) + 64 Short Decodes"
    description: "Small chunk prefill with many short decodes"
    variants_to_run:
      - decode_q1_kv2k: 64
        prefill_q16_kv512k: 1
      - decode_q1_kv4k: 64
        prefill_q16_kv512k: 1
      - decode_q1_kv8k: 64
        prefill_q16_kv512k: 1

  small_chunk_q32_sd64:
    name: "Small Chunk Prefill (32q) + 64 Short Decodes"
    description: "Medium chunk prefill with many short decodes"
    variants_to_run:
      - decode_q1_kv2k: 64
        prefill_q32_kv512k: 1
      - decode_q1_kv4k: 64
        prefill_q32_kv512k: 1
      - decode_q1_kv8k: 64
        prefill_q32_kv512k: 1

  mixed_small_chunks:
    name: "Mixed Small Chunk Prefills + Short Decodes"
    description: "Both small chunk prefills with short decodes"
    variants_to_run:
      - decode_q1_kv2k: 32
        prefill_q16_kv512k: 1
        prefill_q32_kv512k: 1
      - decode_q1_kv4k: 32
        prefill_q16_kv512k: 1
        prefill_q32_kv512k: 1
      - decode_q1_kv8k: 32
        prefill_q16_kv512k: 1
        prefill_q32_kv512k: 1
