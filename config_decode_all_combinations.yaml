# FlashInfer Decode Comprehensive Benchmark: All Combinations
# Tests: All combinations of batch sizes {1,2,4,8,16,32,64,128} x KV cache {1k,2k,4k,8k,16k,32k}
# ==========================================================================

# Model Configuration (aligned with Llama 3-8B)
model:
  num_qo_heads: 32 # Llama 3-8B
  num_kv_heads: 8 # Llama 3-8B (GQA 4:1 ratio)
  head_dim: 128 # Llama 3-8B
  page_size: 256
  workspace_size: 536870912 # 512 MB

# Profiling Configuration
profiling:
  num_warmup_iters: 5
  num_active_iters: 50

# Output Configuration
output:
  results_dir: "results"
  plots_dir: "plots"


# Approaches to benchmark
approaches:
  - flashinfer_mixed_fa2
  - flashinfer_mixed_fa3
  # - flashinfer_mixed_cudnn
  - flashinfer_separated_fa2
  - flashinfer_separated_fa3
  - official_fa3

# Variants - All KV cache lengths
variants:
  decode_q1_kv1k:
    q_tokens: 1
    kv_tokens: 1024
    description: "Decode (1 q, 1K kv)"

  decode_q1_kv2k:
    q_tokens: 1
    kv_tokens: 2048
    description: "Decode (1 q, 2K kv)"

  decode_q1_kv4k:
    q_tokens: 1
    kv_tokens: 4096
    description: "Decode (1 q, 4K kv)"

  decode_q1_kv8k:
    q_tokens: 1
    kv_tokens: 8192
    description: "Decode (1 q, 8K kv)"

  decode_q1_kv16k:
    q_tokens: 1
    kv_tokens: 16384
    description: "Decode (1 q, 16K kv)"

  decode_q1_kv32k:
    q_tokens: 1
    kv_tokens: 32768
    description: "Decode (1 q, 32K kv)"

# Test Scenarios - All combinations (48 total: 8 batch sizes x 6 KV lengths)
scenarios:
  # Batch 1
  decode_b1_kv1k:
    name: "Decode B1 KV1K"
    description: "Batch 1, 1K KV cache"
    variants_to_run:
      - decode_q1_kv1k: 1

  decode_b1_kv2k:
    name: "Decode B1 KV2K"
    description: "Batch 1, 2K KV cache"
    variants_to_run:
      - decode_q1_kv2k: 1

  decode_b1_kv4k:
    name: "Decode B1 KV4K"
    description: "Batch 1, 4K KV cache"
    variants_to_run:
      - decode_q1_kv4k: 1

  decode_b1_kv8k:
    name: "Decode B1 KV8K"
    description: "Batch 1, 8K KV cache"
    variants_to_run:
      - decode_q1_kv8k: 1

  decode_b1_kv16k:
    name: "Decode B1 KV16K"
    description: "Batch 1, 16K KV cache"
    variants_to_run:
      - decode_q1_kv16k: 1

  decode_b1_kv32k:
    name: "Decode B1 KV32K"
    description: "Batch 1, 32K KV cache"
    variants_to_run:
