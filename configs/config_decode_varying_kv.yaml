# FlashInfer Decode-Only Benchmark: Varying KV Cache Length
# Tests: Pure decode workloads with fixed batch size (128), varying KV cache
# ===========================================================================

# Model Configuration (aligned with Llama 3-8B)
model:
  num_qo_heads: 32  # Llama 3-8B
  num_kv_heads: 8   # Llama 3-8B (GQA 4:1 ratio)
  head_dim: 128     # Llama 3-8B
  page_size: 16
  workspace_size: 536870912  # 512 MB

# Profiling Configuration
profiling:
  num_warmup_iters: 5
  num_active_iters: 50

# Output Configuration
output:
  results_dir: "results"
  plots_dir: "plots"


# Approaches to benchmark
approaches:
  - flashinfer_batch_attention
  - flashinfer_mixed_fa2
  - flashinfer_mixed_fa3
  # - flashinfer_mixed_cudnn
  - flashinfer_separated_fa2
  - flashinfer_separated_fa3
  - official_fa3

# Variants - Different KV cache lengths
variants:
  decode_q1_kv512:
    q_tokens: 1
    kv_tokens: 512
    description: "Decode (1 q, 512 kv)"

  decode_q1_kv1k:
    q_tokens: 1
    kv_tokens: 1024
    description: "Decode (1 q, 1K kv)"

  decode_q1_kv2k:
    q_tokens: 1
    kv_tokens: 2048
    description: "Decode (1 q, 2K kv)"

  decode_q1_kv4k:
    q_tokens: 1
    kv_tokens: 4096
    description: "Decode (1 q, 4K kv)"

  decode_q1_kv8k:
    q_tokens: 1
    kv_tokens: 8192
    description: "Decode (1 q, 8K kv)"

  decode_q1_kv16k:
    q_tokens: 1
    kv_tokens: 16384
    description: "Decode (1 q, 16K kv)"

  decode_q1_kv32k:
    q_tokens: 1
    kv_tokens: 32768
    description: "Decode (1 q, 32K kv)"

  decode_q1_kv64k:
    q_tokens: 1
    kv_tokens: 65536
    description: "Decode (1 q, 64K kv)"

  decode_q1_kv128k:
    q_tokens: 1
    kv_tokens: 131072
    description: "Decode (1 q, 128K kv)"

# Test Scenarios - Fixed batch size (128) with varying KV cache
scenarios:
  decode_128_kv512:
    name: "128 Decodes (512 KV)"
    description: "Batch 128 with 512 KV cache"
    variants_to_run:
      - decode_q1_kv512: 128

  decode_128_kv1k:
    name: "128 Decodes (1K KV)"
    description: "Batch 128 with 1K KV cache"
    variants_to_run:
      - decode_q1_kv1k: 128

  decode_128_kv2k:
    name: "128 Decodes (2K KV)"
    description: "Batch 128 with 2K KV cache"
    variants_to_run:
      - decode_q1_kv2k: 128

  decode_128_kv4k:
    name: "128 Decodes (4K KV)"
    description: "Batch 128 with 4K KV cache"
    variants_to_run:
      - decode_q1_kv4k: 128

  decode_128_kv8k:
    name: "128 Decodes (8K KV)"
    description: "Batch 128 with 8K KV cache"
    variants_to_run:
      - decode_q1_kv8k: 128

  decode_128_kv16k:
    name: "128 Decodes (16K KV)"
    description: "Batch 128 with 16K KV cache"
    variants_to_run:
      - decode_q1_kv16k: 128

  decode_128_kv32k:
    name: "128 Decodes (32K KV)"
    description: "Batch 128 with 32K KV cache"
    variants_to_run:
      - decode_q1_kv32k: 128

  decode_128_kv64k:
    name: "128 Decodes (64K KV)"
    description: "Batch 128 with 64K KV cache"
    variants_to_run:
      - decode_q1_kv64k: 128

