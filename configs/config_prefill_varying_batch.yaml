# FlashInfer Prefill-Only Benchmark: Varying Batch Size
# Tests: Pure prefill workloads with varying batch sizes, fixed 1K sequence length
# ==================================================================================

# Model Configuration (aligned with Llama 3-8B)
model:
  num_qo_heads: 32  # Llama 3-8B
  num_kv_heads: 8   # Llama 3-8B (GQA 4:1 ratio)
  head_dim: 128     # Llama 3-8B
  page_size: 16
  workspace_size: 536870912  # 512 MB

# Profiling Configuration
profiling:
  num_warmup_iters: 5
  num_active_iters: 50

# Output Configuration
output:
  results_dir: "results"
  plots_dir: "plots"


# Approaches to benchmark
approaches:
  - flashinfer_batch_attention
  - flashinfer_mixed_fa2
  - flashinfer_mixed_fa3
  # - flashinfer_mixed_cudnn
  - flashinfer_separated_fa2
  - flashinfer_separated_fa3
  - official_fa3

# Variants
variants:
  prefill_q1k_kv1k:
    q_tokens: 1024
    kv_tokens: 1024
    description: "Prefill (1K tokens)"

# Test Scenarios - Varying number of prefill requests
scenarios:
  prefill_batch_1:
    name: "Batch 1 (1K seq)"
    description: "1 prefill request"
    variants_to_run:
      - prefill_q1k_kv1k: 1

  prefill_batch_2:
    name: "Batch 2 (1K seq)"
    description: "2 prefill requests"
    variants_to_run:
      - prefill_q1k_kv1k: 2

  prefill_batch_4:
    name: "Batch 4 (1K seq)"
    description: "4 prefill requests"
    variants_to_run:
      - prefill_q1k_kv1k: 4

  prefill_batch_8:
    name: "Batch 8 (1K seq)"
    description: "8 prefill requests"
    variants_to_run:
      - prefill_q1k_kv1k: 8

  prefill_batch_16:
    name: "Batch 16 (1K seq)"
    description: "16 prefill requests"
    variants_to_run:
      - prefill_q1k_kv1k: 16

  prefill_batch_32:
    name: "Batch 32 (1K seq)"
    description: "32 prefill requests"
    variants_to_run:
      - prefill_q1k_kv1k: 32

  prefill_batch_64:
    name: "Batch 64 (1K seq)"
    description: "64 prefill requests"
    variants_to_run:
      - prefill_q1k_kv1k: 64

  prefill_batch_128:
    name: "Batch 128 (1K seq)"
    description: "128 prefill requests"
    variants_to_run:
      - prefill_q1k_kv1k: 128

  prefill_batch_256:
    name: "Batch 256 (1K seq)"
    description: "256 prefill requests"
    variants_to_run:
      - prefill_q1k_kv1k: 256
