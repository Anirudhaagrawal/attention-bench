# Simple test config for cuDNN approach
# ======================================

# Model Configuration
model:
  num_qo_heads: 32
  num_kv_heads: 8
  head_dim: 128
  page_size: 16
  workspace_size: 536870912  # 512 MB

# Profiling Configuration
profiling:
  num_warmup_iters: 2
  num_active_iters: 5

# Output Configuration
output:
  results_dir: "results"
  plots_dir: "plots"

# Approaches to benchmark
approaches:
  - direct_cudnn
  - flashinfer_mixed_fa3  # For comparison

# Variants
variants:
  prefill_128:
    q_tokens: 128
    kv_tokens: 128
    description: "Small prefill (128 q, 128 kv)"

  decode_256:
    q_tokens: 1
    kv_tokens: 256
    description: "Small decode (1 q, 256 kv)"

# Test Scenarios
scenarios:
  test_prefill:
    name: "Test Prefill"
    description: "Single prefill request"
    variants_to_run:
      - prefill_128: 1

  test_decode:
    name: "Test Decode"
    description: "4 decode requests"
    variants_to_run:
      - decode_256: 4
