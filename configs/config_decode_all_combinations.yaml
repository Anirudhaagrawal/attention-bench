# FlashInfer Decode Benchmark: All Combinations (Programmatic)
# Tests: Pure decode workloads across batch sizes and KV lengths
# Generates: 8 batch sizes × 8 KV lengths = 64 scenarios
# ==========================================================================

# Model Configuration (aligned with Llama 3-8B)
model:
  num_qo_heads: 32  # Llama 3-8B
  num_kv_heads: 8   # Llama 3-8B (GQA 4:1 ratio)
  head_dim: 128     # Llama 3-8B
  page_size: 16     # Default 256 for fair comparison with Official FA3
  workspace_size: 536870912  # 512 MB

# Profiling Configuration
profiling:
  num_warmup_iters: 5
  num_active_iters: 10

# Output Configuration
output:
  results_dir: "results"
  plots_dir: "plots"

# Approaches to benchmark
approaches:
  - flashinfer_batch_attention
  - flashinfer_mixed_fa2
  - flashinfer_mixed_fa3
  - flashinfer_separated_fa2
  - flashinfer_separated_fa3
  - official_fa3

# Programmatic Scenario Generation
scenario_generation:
  strategy: "all_combinations"
  workload_type: "decode"
  parameters:
    batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
    kv_tokens: [512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144]
