# FlashInfer Mixed Decode+Prefill Benchmark: Multi-Model, Multi-TP
# Tests different model sizes and TP degrees
# ==========================================================================

# Profiling Configuration
profiling:
  num_warmup_iters: 5
  num_active_iters: 10

# Output Configuration
output:
  results_dir: "results"
  plots_dir: "plots"

# Approaches to benchmark
approaches:
  - flashinfer_batch_attention
  - flashinfer_mixed_fa2
  - flashinfer_mixed_fa3
  - flashinfer_separated_fa2
  - flashinfer_separated_fa3
  - official_fa3

# Model Configurations
models:
  llama_8b:
    name: "llama8b"
    num_qo_heads: 32  # Llama 3-8B
    num_kv_heads: 8   # Llama 3-8B (GQA 4:1 ratio)
    head_dim: 128
    page_size: 16
    workspace_size: 536870912  # 512 MB

  llama_70b:
    name: "llama70b"
    num_qo_heads: 64  # Llama 3-70B
    num_kv_heads: 8   # Llama 3-70B (GQA 8:1 ratio)
    head_dim: 128
    page_size: 16
    workspace_size: 536870912  # 512 MB

# Tensor Parallelism Degrees for Profiling
# IMPORTANT: These are profiling configurations, NOT multi-GPU execution!
#
# For each TP degree, we profile what ONE GPU would do in a TP setup:
#   - TP=4: Profile 1 GPU with 1/4 of the heads (simulates 4-way TP per-GPU workload)
#   - We measure single-GPU kernel performance with reduced head counts
#   - We do NOT run actual multi-GPU TP with communication
#
# This gives us the per-GPU compute time in different TP configurations.
# For each TP degree: heads_per_gpu = total_heads / tp_degree
tp_degrees: [1, 2, 4, 8]

# Programmatic Scenario Generation
scenario_generation:
  strategy: "mixed_combinations"
  decode_params:
    batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
    kv_tokens: [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576]
  prefill_params:
    q_tokens: [128, 256, 512, 1024, 2048, 4096, 8192, 16384]
    kv_tokens: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576]
