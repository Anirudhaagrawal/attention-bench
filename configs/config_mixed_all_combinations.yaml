# FlashInfer Mixed Decode+Prefill Comprehensive Benchmark
# Tests: All combinations of decode and prefill scenarios
# Decode: Batch {1,2,4,8,16,32,64,128} x KV {1K,2K,4K,8K,16K,32K} = 48 configs
# Prefill: Q {128,256,512,1K,2K,4K,8K} x KV {>=Q up to 64K} = 49 configs
# Total mixed scenarios: 2352
# ==========================================================================

model:
  num_qo_heads: 32
  num_kv_heads: 8
  head_dim: 128
  page_size: 16
  workspace_size: 536870912
profiling:
  num_warmup_iters: 5
  num_active_iters: 50
output:
  results_dir: results
  plots_dir: plots

# Approaches to benchmark
approaches:
  - flashinfer_batch_attention
  - flashinfer_mixed_fa2
  - flashinfer_mixed_fa3
  # - flashinfer_mixed_cudnn
  - flashinfer_separated_fa2
  - flashinfer_separated_fa3
  - official_fa3

