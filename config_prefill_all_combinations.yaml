# FlashInfer Prefill Comprehensive Benchmark: All Combinations
# Tests: Batch size 1, Q tokens {128,256,512,1k,2k,4k,8k} x KV tokens {=Q,1k,2k,4k,8k,16k,32k,64k}
# ==========================================================================

# Model Configuration (aligned with Llama 3-8B)
model:
  num_qo_heads: 32  # Llama 3-8B
  num_kv_heads: 8   # Llama 3-8B (GQA 4:1 ratio)
  head_dim: 128     # Llama 3-8B
  page_size: 256
  workspace_size: 536870912  # 512 MB

# Profiling Configuration
profiling:
  num_warmup_iters: 5
  num_active_iters: 50

# Output Configuration
output:
  results_dir: "results"
  plots_dir: "plots"


# Approaches to benchmark
approaches:
  - flashinfer_mixed_fa2
  - flashinfer_mixed_fa3
  # - flashinfer_mixed_cudnn
  - flashinfer_separated_fa2
  - flashinfer_separated_fa3
  - official_fa3

# Variants - All Q and KV combinations
